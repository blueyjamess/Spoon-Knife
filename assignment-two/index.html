<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class and ID Selectors</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <p>Number 1 - I'm a class!</p> <!-- I used type selector here, since all the odd numbers have the 'p' tag in common.-->
    <div class="the-second-element">Number 2 - I'm one ID.</div>
    <p class="p the-third-element">Number 3 - I'm a class, but cooler!</p> <!-- I used multiple classes here, since the defined class of 'p'was already existing in the 'p' tag, I used skipped the exitsting declarations of background colour and font and created a new class for the additional declaration which is the font-size -->
    <div class="the-fourth-element">Number 4 - I'm another ID.</div>
    <p>Number 5 - I'm a class!</p>
  </body>
</html>
